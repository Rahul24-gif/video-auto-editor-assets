<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Glow filter -->
    <filter id="neonRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF2A2A" flood-opacity="0.9" />
    </filter>
    <filter id="neonYellowGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFE600" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- 1. Hand-Drawn Bouncing Red Arrow (Pointing to subject or caption) -->
  <g id="curved_red_arrow" transform="translate(420, 800)" filter="url(#neonRedGlow)">
    <path d="M 10 120 Q 80 40 180 80 Q 220 95 260 60" fill="none" stroke="#FF2A2A" stroke-width="14" stroke-linecap="round" />
    <polygon points="275,45 270,85 240,65" fill="#FF2A2A" />
  </g>

  <!-- 2. Attention Highlight Oval Circle (Circling an object in video) -->
  <g id="highlight_circle" transform="translate(340, 500)" filter="url(#neonYellowGlow)">
    <ellipse cx="200" cy="120" rx="190" ry="110" fill="none" stroke="#FFE600" stroke-width="12" stroke-dasharray="24 12" stroke-linecap="round" transform="rotate(-8 200 120)" />
  </g>

  <!-- 3. Scribble Emphasis Underline -->
  <g id="scribble_underline" transform="translate(300, 1100)" filter="url(#neonYellowGlow)">
    <path d="M 20 20 Q 120 5 220 25 Q 320 40 420 18 Q 460 12 480 22" fill="none" stroke="#FFE600" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- 4. Target Reticle / Focus Crosshair -->
  <g id="focus_reticle" transform="translate(490, 910)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#00FFCC" stroke-width="4" stroke-dasharray="16 8" />
    <line x1="50" y1="0" x2="50" y2="25" stroke="#00FFCC" stroke-width="4" />
    <line x1="50" y1="75" x2="50" y2="100" stroke="#00FFCC" stroke-width="4" />
    <line x1="0" y1="50" x2="25" y2="50" stroke="#00FFCC" stroke-width="4" />
    <line x1="75" y1="50" x2="100" y2="50" stroke="#00FFCC" stroke-width="4" />
    <circle cx="50" cy="50" r="5" fill="#FF0055" />
  </g>
</svg>
