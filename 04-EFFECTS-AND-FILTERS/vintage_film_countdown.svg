<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Grunge Film Texture / Sepia Tone -->
    <filter id="vintageGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.15 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="over" />
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#2B2B2B" />

  <!-- Countdown Target Crosshairs -->
  <g stroke="#E5E5E5" stroke-width="4" fill="none">
    <!-- Outer Ring -->
    <circle cx="540" cy="960" r="320" />
    <!-- Inner Ring -->
    <circle cx="540" cy="960" r="260" stroke-dasharray="16 8" />
    <!-- Crosshairs -->
    <line x1="140" y1="960" x2="940" y2="960" />
    <line x1="540" y1="560" x2="540" y2="1360" />
    
    <!-- Rotating Sector Wedge (45 deg) -->
    <path d="M 540 960 L 540 640 A 320 320 0 0 1 766 734 Z" fill="rgba(255, 255, 255, 0.25)" stroke="none" />
  </g>

  <!-- Big Bold Vintage Countdown Number "3" -->
  <text x="540" y="1035" font-family="Courier New, monospace" font-size="220" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
</svg>
