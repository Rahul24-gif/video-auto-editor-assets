<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Matrix Glow -->
    <filter id="matrixGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FF66" flood-opacity="0.9" />
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="#0D1117" />
  
  <!-- Cyberpunk Matrix Code Rain Streams -->
  <g font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#00FF66" opacity="0.85" filter="url(#matrixGlow)">
    <!-- Column 1 -->
    <text x="60" y="100" fill="#FFFFFF">0</text>
    <text x="60" y="140">1</text>
    <text x="60" y="180">X</text>
    <text x="60" y="220">9</text>
    <text x="60" y="260">F</text>
    <text x="60" y="300">4</text>
    <text x="60" y="340" opacity="0.5">A</text>
    <text x="60" y="380" opacity="0.2">7</text>

    <!-- Column 2 -->
    <text x="180" y="300" fill="#FFFFFF">A</text>
    <text x="180" y="340">I</text>
    <text x="180" y="380">_</text>
    <text x="180" y="420">E</text>
    <text x="180" y="460">D</text>
    <text x="180" y="500">I</text>
    <text x="180" y="540">T</text>
    <text x="180" y="580" opacity="0.6">O</text>
    <text x="180" y="620" opacity="0.3">R</text>

    <!-- Column 3 -->
    <text x="320" y="80" fill="#FFFFFF">1</text>
    <text x="320" y="120">0</text>
    <text x="320" y="160">1</text>
    <text x="320" y="200">1</text>
    <text x="320" y="240">0</text>

    <!-- Column 4 (Center stream) -->
    <text x="540" y="500" fill="#FFFFFF">C</text>
    <text x="540" y="540">O</text>
    <text x="540" y="580">D</text>
    <text x="540" y="620">E</text>
    <text x="540" y="660">X</text>
    <text x="540" y="700">8</text>
    <text x="540" y="740" opacity="0.5">2</text>

    <!-- Column 5 -->
    <text x="760" y="200" fill="#FFFFFF">9</text>
    <text x="760" y="240">F</text>
    <text x="760" y="280">E</text>
    <text x="760" y="320">D</text>
    <text x="760" y="360">3</text>

    <!-- Column 6 -->
    <text x="940" y="400" fill="#FFFFFF">P</text>
    <text x="940" y="440">I</text>
    <text x="940" y="480">P</text>
    <text x="940" y="520">E</text>
    <text x="940" y="560">L</text>
    <text x="940" y="600">I</text>
    <text x="940" y="640">N</text>
    <text x="940" y="680">E</text>
  </g>
</svg>
